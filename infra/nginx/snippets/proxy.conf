# Included by every location that proxies.
#
# This exists because of an nginx rule that catches everyone once:
# proxy_set_header does NOT merge across levels. If you set headers in the
# http block and then set a single proxy_set_header inside a location, the
# http-level ones are discarded for that location. So the full set has to be
# repeated in every location, and the honest way to do that is an include.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# $connection_upgrade comes from the map in conf.d/00-upstreams.conf.
# It is "upgrade" for websocket requests and "close" otherwise.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
