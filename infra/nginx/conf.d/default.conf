# Production reverse proxy.
#
# Ships HTTP-only so `./prod.sh up` works the moment you have a server,
# before you own a domain or a certificate. An https server block pointing at
# certificate files that do not exist stops nginx from starting at all, which
# is a confusing first failure. Turn TLS on in three steps:
#
#   1. point your domain's A record at the VPS
#   2. ./prod.sh certbot your-domain.com you@example.com
#   3. uncomment the https server block below, replace your-domain.com,
#      uncomment the redirect in the http block, then ./prod.sh reload
#
# On proxy_pass: the hostname goes through a variable deliberately, so nginx
# resolves it per request instead of once at startup. See 00-upstreams.conf.
# A variable in proxy_pass also turns off nginx's automatic URI rewriting,
# which is why each one ends with $request_uri (the full original path plus
# query string).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25m;

    # Certbot writes challenge files here through a shared volume. This
    # location must stay reachable over plain HTTP forever, including after
    # you add the redirect below, or certificate renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── step 3: uncomment this, and delete the three locations below ──
    # return 301 https://$host$request_uri;

    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
        set $api_upstream http://backend:4000;
        proxy_pass $api_upstream$request_uri;
    }

    # Next.js names these files by content hash, so they can be cached
    # forever. A new deploy produces new filenames.
    location /_next/static/ {
        include /etc/nginx/snippets/proxy.conf;
        set $web_upstream http://frontend:3000;
        proxy_pass $web_upstream$request_uri;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
        set $web_upstream http://frontend:3000;
        proxy_pass $web_upstream$request_uri;
    }
}

