# Production stack for the VPS. Driven by ./prod.sh, which supplies
# --env-file .env.prod.
#
# Differences from development that are deliberate:
#   - images are built, nothing is bind mounted. A deploy is a rebuild
#   - postgres does NOT publish a port. It is reachable only from the
#     compose network, which is the single biggest security win here
#   - nginx is the only container with ports open to the internet
#
# One thing that is NOT a difference any more: the container user. The dev
# stages stopped remapping a `node` user to the host's uid, because rootless
# docker already maps container root onto the host user, and `USER node` is
# commented out in the production stages of both Dockerfiles as well. So these
# containers run as root inside their own namespace.
#
# Nothing here is bind mounted and nothing writes to the host, so the blast
# radius is a container that is already disposable; the cost is that a process
# which escapes the runtime starts out as uid 0 rather than having to climb
# there. To put it back, either uncomment `USER node` in the production stage
# of backend/Dockerfile and frontend/Dockerfile, or add `user: "node"` to the
# two services below -- no rebuild needed for the second one.
#
# While the frontend is on Vercel you can skip its container:
#   ./prod.sh up postgres backend nginx

name: ourcityvoice-prod

services:
  # ── postgres ──────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # No `ports:` on purpose. Nothing outside the docker network can reach
    # the database. To inspect it, use ./prod.sh psql.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [ocv]

  # ── backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: production
    image: ourcityvoice-backend:latest
    # Runs as root. See the note at the top of this file.
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ocv]

  # ── frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # NEXT_PUBLIC_* is compiled into the client bundle, so it has to be
        # known at build time. Changing it means rebuilding the image.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: ourcityvoice-frontend:latest
    # Runs as root, like the backend. See the note at the top of this file.
    restart: always
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:4000/api/v1}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_started
    networks: [ocv]

  # ── nginx ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      # Snippets live outside conf.d because everything in conf.d is
      # auto-included into the http block, and a snippet of location-level
      # directives would be a syntax error there.
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      # Shared with certbot: the ACME challenge webroot and the certificates.
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      - backend
    networks: [ocv]

  # ── certbot ───────────────────────────────────────────────────────
  # Runs on demand, not as a long-lived service:
  #   ./prod.sh certbot your-domain.com you@example.com
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'run via ./prod.sh certbot <domain> <email>'"]

volumes:
  postgres-data:
  certbot-webroot:
  certbot-certs:

networks:
  ocv:
    driver: bridge
