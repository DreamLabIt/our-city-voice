# Files in conf.d are included inside nginx's http block, so http-level
# directives like `map` and `resolver` belong here. The 00- prefix only
# controls include order.

# Docker's embedded DNS server, available to every container on a
# user-defined network. The locations in default.conf resolve "backend" and
# "frontend" through this at request time.
#
# This replaces the usual `upstream { server backend:4000; }` block on
# purpose. An upstream block resolves its hostname once, when nginx starts,
# and that has two consequences on docker:
#
#   1. nginx refuses to start at all if the container is not up yet, with
#      "host not found in upstream". That is fatal while the frontend lives
#      on Vercel and its container is never started.
#   2. after a deploy recreates the backend, nginx keeps proxying to the old
#      container's IP until someone reloads it.
#
# Re-resolving every 10s costs a local DNS lookup and fixes both. The price
# is losing the keepalive connection pool, which does not matter at this size.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Websocket-aware Connection header: "upgrade" for websocket requests,
# "close" for everything else.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
